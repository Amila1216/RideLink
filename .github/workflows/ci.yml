
name: RideLink CI Pipeline

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: account-service
            java: '17'

          - service: driver-vehicle-service
            java: '21'

          - service: ride-service
            java: '17'

          - service: fare-payment-service
            java: '17'

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Generate test JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build and run tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ridelink_ci
          SPRING_DATA_MONGODB_URI: mongodb://127.0.0.1:27017/ridelink_ci
        run: mvn -B -f "${{ matrix.service }}/pom.xml" clean verify
